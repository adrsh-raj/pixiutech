services:
  - type: pserv
    name: pixiu-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.5.4-debian13-slim
    plan: 2c-4g
    envVars:
      - key: CLAMD_CONF_StreamMaxLength
        value: "30M"
      - key: CLAMD_CONF_TCPSocket
        value: "3310"
      - key: CLAMD_CONF_TCPAddr
        value: "0.0.0.0"
      - key: CLAMD_CONF_ConcurrentDatabaseReload
        value: "no"
      - key: CLAMD_CONF_MaxThreads
        value: "4"
      - key: FRESHCLAM_CHECKS
        value: "24"
      - key: CLAMAV_NO_MILTERD
        value: "true"
      - key: CLAMD_STARTUP_TIMEOUT
        value: "1800"

  - type: web
    name: pixiu-django-api
    runtime: python
    rootDir: pixiu-backend
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: DJANGO_LOGIN_RATE
        value: 10/min
      - key: DJANGO_UPLOAD_RATE
        value: 30/hour
      - key: DJANGO_TRAINER_MATERIAL_UPLOAD_RATE
        value: 30/hour
      - key: DJANGO_CAREER_APPLY_RATE
        value: 5/hour
      - key: DJANGO_PUBLIC_ENQUIRY_RATE
        value: 10/hour
      - key: DJANGO_PORTAL_IDLE_TIMEOUT_SECONDS
        value: "600"
      - key: DJANGO_LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: DJANGO_LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: DJANGO_PASSWORD_RESET_TIMEOUT
        value: "3600"
      - key: DJANGO_PASSWORD_RESET_RATE
        value: 10/hour
      - key: DJANGO_STUDENT_PASSWORD_RESET_RATE
        value: 20/hour
      - key: DJANGO_CSRF_TOKEN_RATE
        value: 30/hour
      - key: DJANGO_ADMIN_ENABLED
        value: "False"
      - key: DJANGO_ADMIN_PATH
        value: ""
      - key: CAREER_CV_MAX_MB
        value: "2"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_EXPECTED_DATABASE_NAME
        sync: false
      - key: DJANGO_DB_SSLMODE
        value: require
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "60"
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_ENABLED
        value: "True"
      - key: CLAMAV_ENABLED
        value: "True"
      - key: CLAMAV_REQUIRED
        value: "True"
      - key: CLAMAV_HOSTPORT
        fromService:
          type: pserv
          name: pixiu-clamav
          property: hostport
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: pixiu-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_SECONDS
        value: "30"
      - key: CLAMAV_RETRY_ATTEMPTS
        value: "3"
      - key: CLAMAV_RETRY_BACKOFF_SECONDS
        value: "1"
      - key: CLAMAV_CHUNK_SIZE
        value: "1048576"
