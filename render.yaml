services:
  - type: pserv
    name: pixiu-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.5.4-debian13-slim
    plan: 2c-4g

  - type: web
    name: pixiu-django-api
    runtime: python
    rootDir: pixiu-backend
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: DJANGO_LOGIN_RATE
        value: 10/min
      - key: DJANGO_UPLOAD_RATE
        value: 30/hour
      - key: DJANGO_TRAINER_MATERIAL_UPLOAD_RATE
        value: 30/hour
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_EXPECTED_DATABASE_NAME
        sync: false
      - key: DJANGO_DB_SSLMODE
        value: require
      - key: DJANGO_DB_CONN_MAX_AGE
        value: "60"
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_ENABLED
        value: "True"
      - key: CLAMAV_ENABLED
        value: "True"
      - key: CLAMAV_REQUIRED
        value: "True"
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: pixiu-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"
      - key: CLAMAV_TIMEOUT_SECONDS
        value: "30"
      - key: CLAMAV_CHUNK_SIZE
        value: "1048576"
