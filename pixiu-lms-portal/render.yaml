databases:
  - name: pixiu-lms-db
    plan: free
    region: singapore
    databaseName: pixiu_lms
    postgresMajorVersion: "17"
    connectionPool: none

services:
  - type: web
    name: pixiu-lms-api
    runtime: node
    region: singapore
    plan: free
    rootDir: pixiu-lms-portal/server
    buildCommand: npm install
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com
      - key: DATABASE_URL
        fromDatabase:
          name: pixiu-lms-db
          property: connectionString
      - key: DB_POOL_MAX
        value: 10
      - key: DB_STATEMENT_TIMEOUT_MS
        value: 10000
