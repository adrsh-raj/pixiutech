services:
  - type: web
    name: pixiu-lms-api
    runtime: node
    region: singapore
    plan: free
    rootDir: pixiu-lms-portal/server
    buildCommand: npm install
    startCommand: node start.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      - key: JWT_SECRET
        generateValue: true
