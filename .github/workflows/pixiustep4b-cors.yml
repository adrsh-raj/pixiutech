name: PIXIU Step 4b CORS Hardening

on:
  push:
    paths:
      - '.github/step4b-trigger'

permissions:
  contents: write

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify production CORS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('pixiu-lms-portal/server/index.js')
          text = p.read_text()
          if "const { buildCorsOptions } = require('./middleware/cors');" not in text:
              marker = "const { authorizationMiddleware } = require('./middleware/authorization');"
              if marker not in text: raise SystemExit('authorization import marker missing')
              text = text.replace(marker, marker + "\nconst { buildCorsOptions } = require('./middleware/cors');", 1)
          inline = re.compile(r"const configuredOrigins = \(process\.env\.CORS_ORIGINS \|\| ''\).*?app\.use\(cors\(\{.*?\}\);\n", re.S)
          if inline.search(text):
              text = inline.sub("const corsOptions = buildCorsOptions();\napp.use(cors(corsOptions));\n", text, count=1)
          elif "app.use(cors(corsOptions));" not in text:
              raise SystemExit('CORS configuration block not found')
          p.write_text(text)
          PY
          node --check pixiu-lms-portal/server/index.js
          node --check pixiu-lms-portal/server/middleware/cors.js
          CORS_ORIGINS='https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com' node - <<'NODE'
          const { buildCorsOptions, normalizeOrigins } = require('./pixiu-lms-portal/server/middleware/cors');
          const origins = normalizeOrigins(process.env.CORS_ORIGINS);
          if (origins.length !== 3) throw new Error('Expected exactly three official production origins');
          for (const bad of ['*', 'http://localhost:3000', 'https://evil.example/path']) {
            let rejected = false;
            try { normalizeOrigins(bad); } catch { rejected = true; }
            if (!rejected) throw new Error(`Unsafe origin accepted: ${bad}`);
          }
          const opts = buildCorsOptions();
          if (opts.credentials !== false) throw new Error('Bearer-token API must not enable CORS credentials');
          if (opts.optionsSuccessStatus !== 204) throw new Error('Unexpected preflight status');
          opts.origin('https://portal.pixiutech.com', (err, allowed) => { if (err || allowed !== true) throw new Error('Official origin rejected'); });
          opts.origin('https://evil.example', (err, allowed) => { if (err || allowed !== false) throw new Error('Untrusted origin allowed'); });
          console.log('Step 4 CORS assertions passed');
          NODE
          python - <<'PY'
          from pathlib import Path
          render = Path('pixiu-lms-portal/render.yaml').read_text()
          if 'key: CORS_ORIGINS' not in render: raise SystemExit('Render CORS_ORIGINS missing')
          low = render.lower()
          if 'localhost' in low or '127.0.0.1' in low or '*' in render: raise SystemExit('Unsafe CORS value in render.yaml')
          start = Path('pixiu-lms-portal/server/start.js').read_text()
          if 'CORS_ORIGINS' not in start: raise SystemExit('start.js CORS fail-closed guard missing')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/pixiustep4b-cors.yml .github/step4b-trigger
          git add pixiu-lms-portal/server/index.js pixiu-lms-portal/server/middleware/cors.js pixiu-lms-portal/server/.env.example pixiu-lms-portal/render.yaml
          git commit -m 'security: finalize production CORS policy'
          git push origin HEAD:main
