name: Repo Security Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair security and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')

          remove_paths = [
              'src/data/seedData.js',
              'pixiu-lms-portal/src/data/seedData.js',
              'pixiu-lms-portal/server/seed_sessions_attendance.js',
              'pixiu-lms-portal/server/pixiu_lms.db',
              'public/_redirects',
              'src/styles/hub.css',
          ]
          for raw in remove_paths:
              p = root / raw
              if p.exists():
                  if p.is_dir(): shutil.rmtree(p)
                  else: p.unlink()

          # Keep exactly one implementation of the circuit lab: the LMS portal.
          for raw in ['src/components/circuit-lab', 'src/lib/circuitLab', 'src/lib/circuit-lab']:
              p = root / raw
              if p.exists(): shutil.rmtree(p)

          # Move any remaining public teacher material into the protected server area.
          public_materials = root / 'public/materials'
          private_materials = root / 'pixiu-lms-portal/server/private/materials'
          if public_materials.exists():
              private_materials.mkdir(parents=True, exist_ok=True)
              for src in public_materials.iterdir():
                  dest = private_materials / src.name
                  if not dest.exists(): shutil.move(str(src), str(dest))
              if public_materials.exists(): shutil.rmtree(public_materials)

          index = root / 'pixiu-lms-portal/server/index.js'
          text = index.read_text(encoding='utf-8')
          text = text.replace("app.use('/uploads', express.static(uploadsDir));\n", '')
          text = text.replace("const fileUrl = `/uploads/${req.file.filename}`;", "const fileUrl = `/api/uploads/${req.file.filename}`;")

          protected_upload_route = '''// Uploaded evidence is private. The auth middleware runs before this route.\napp.get('/api/uploads/:filename', (req, res) => {\n  const filename = decodeURIComponent(req.params?.filename || '');\n  if (!/^evidence-[A-Za-z0-9._-]+\\.(jpg|jpeg|png|webp|gif)$/i.test(filename)) {\n    return res.status(400).json({ error: 'Invalid upload filename.' });\n  }\n\n  const filePath = path.join(uploadsDir, filename);\n  const resolvedRoot = path.resolve(uploadsDir);\n  const resolvedFile = path.resolve(filePath);\n  if (!resolvedFile.startsWith(`${resolvedRoot}${path.sep}`)) {\n    return res.status(400).json({ error: 'Invalid upload path.' });\n  }\n  if (!fs.existsSync(filePath)) {\n    return res.status(404).json({ error: 'Upload not found.' });\n  }\n\n  res.setHeader('Cache-Control', 'private, max-age=300');\n  res.setHeader('X-Content-Type-Options', 'nosniff');\n  res.type(path.extname(filePath));\n  return res.sendFile(filePath);\n});'''

          marker = "app.use('/api', requireAuth);\napp.use('/api', authorizationMiddleware(db));"
          if "app.get('/api/uploads/:filename'" not in text:
              if marker not in text:
                  raise SystemExit('Expected auth middleware marker not found; aborting.')
              text = text.replace(marker, "app.use('/api', requireAuth);\n\n" + protected_upload_route + "\n\napp.use('/api', authorizationMiddleware(db));", 1)
          index.write_text(text, encoding='utf-8')

          # The workflow is a one-shot repair helper; do not keep it in the repo.
          workflow = root / '.github/workflows/repo-security-repair.yml'
          if workflow.exists(): workflow.unlink()
          PY

          # Validate the actual exposure boundaries, while allowing the protected API path.
          if grep -R --line-number --exclude-dir=.git --exclude='*.lock' "public/materials\|app\.use('/uploads'" src pixiu-lms-portal public 2>/dev/null; then
            echo "Unexpected public material/static upload exposure found."
            exit 1
          fi

          if grep -R --line-number --exclude-dir=.git --exclude='*.lock' "const fileUrl = `/uploads/" pixiu-lms-portal src public 2>/dev/null; then
            echo "Legacy public upload URL found."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "security: close private-data and upload exposure"
          git push origin main
