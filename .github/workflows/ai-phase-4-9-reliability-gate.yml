name: PIXIU AI Lab Phase 4-9 Reliability Gate

on:
  pull_request:
    branches:
      - main
      - ai-runtime/phase-2-3-inference-runtimes
    paths:
      - "pixiu-lms-portal/src/components/circuit-lab/**"
      - "pixiu-lms-portal/src/lib/ai/**"
      - "pixiu-lms-portal/src/lib/ai-studio-engine.ts"
      - "pixiu-lms-portal/package.json"
      - "pixiu-lms-portal/package-lock.json"
      - "scripts/phase*.mjs"
      - "scripts/sync-ai-runtime-assets.mjs"
      - ".github/workflows/ai-phase-4-9-reliability-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai_phase_4_9:
    name: AI/CyberLab Phase 4-9 reliability verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: pixiu-lms-portal/.node-version
          cache: npm
          cache-dependency-path: pixiu-lms-portal/package-lock.json
      - name: Install portal dependencies
        working-directory: pixiu-lms-portal
        run: npm ci
      - name: Phase 4-9 reliability gate
        working-directory: pixiu-lms-portal
        run: npm run qa:phase4-9
      - name: Phase 2-3 continuity gate
        working-directory: pixiu-lms-portal
        run: npm run qa:phase2-3
      - name: Phase A(1) continuity gate
        working-directory: pixiu-lms-portal
        run: npm run qa:phase-a1
      - name: Portal lint
        working-directory: pixiu-lms-portal
        run: npm run lint
      - name: Production build
        working-directory: pixiu-lms-portal
        run: npm run build
