name: One-time fix duplicate kits request

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-duplicate-kits.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch StudentPortal kit loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pixiu-lms-portal/src/pages/StudentPortal.jsx')
          s = p.read_text(encoding='utf-8')
          old = "useEffect(()=>{let active=true;apiFetch('/kits').then(async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.detail||p.error||`Unable to load kit data (${r.status}).`);return p;}).then(p=>active&&setKits(collection(p))).catch(e=>active&&setKitError(e.message||'Unable to load kit data.')).finally(()=>active&&setKitLoading(false));return()=>{active=false}},[student?.id]);"
          new = "useEffect(()=>{let active=true;apiFetch('/kits').then(async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.detail||p.error||`Unable to load kit data (${r.status}).`);return p;}).then(p=>active&&setKits(collection(p))).catch(e=>active&&setKitError(e.message||'Unable to load kit data.')).finally(()=>active&&setKitLoading(false));return()=>{active=false}},[]);"
          if old not in s:
              raise SystemExit('Expected StudentPortal kits effect was not found; refusing to make an unsafe edit.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixiu-lms-portal/src/pages/StudentPortal.jsx
          git rm .github/workflows/fix-duplicate-kits.yml
          git commit -m "Fix duplicate kits request"
          git push
