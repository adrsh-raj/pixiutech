name: PIXIU Step 4c CORS Hardening
on:
  push:
    paths: ['.github/step4c-trigger']
permissions:
  contents: write
jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply CORS policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pixiu-lms-portal/server/index.js')
          t=p.read_text()
          if "const { buildCorsOptions } = require('./middleware/cors');" not in t:
              m="const { authorizationMiddleware } = require('./middleware/authorization');"
              t=t.replace(m,m+"\nconst { buildCorsOptions } = require('./middleware/cors');",1)
          if 'app.use(cors(corsOptions));' not in t:
              a=t.find('const configuredOrigins =')
              b=t.find('app.use(express.json',a)
              if a<0 or b<0 or b<=a: raise SystemExit('CORS block not safely located')
              t=t[:a]+"const corsOptions = buildCorsOptions();\napp.use(cors(corsOptions));\n\n"+t[b:]
          p.write_text(t)
          PY
          node --check pixiu-lms-portal/server/index.js
          node --check pixiu-lms-portal/server/middleware/cors.js
          CORS_ORIGINS='https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com' node - <<'NODE'
          const {buildCorsOptions,normalizeOrigins}=require('./pixiu-lms-portal/server/middleware/cors');
          const official='https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com';
          if(JSON.stringify(normalizeOrigins(official))!==JSON.stringify(official.split(','))) throw new Error('official origins mismatch');
          for(const bad of ['*','http://localhost:3000','http://127.0.0.1:5173','https://evil.example/path']) { let ok=false; try{normalizeOrigins(bad)}catch{ok=true} if(!ok) throw new Error('unsafe origin accepted: '+bad) }
          const o=buildCorsOptions(); if(o.credentials!==false||o.optionsSuccessStatus!==204) throw new Error('unsafe CORS options');
          o.origin('https://portal.pixiutech.com',(e,a)=>{if(e||a!==true)throw new Error('official origin rejected')});
          o.origin('https://evil.example',(e,a)=>{if(e||a!==false)throw new Error('evil origin allowed')});
          console.log('CORS policy assertions passed');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/pixiustep4-cors.yml .github/workflows/pixiustep4b-cors.yml .github/workflows/pixiustep4c-cors.yml .github/step4-trigger .github/step4b-trigger .github/step4c-trigger
          git add -A
          git commit -m 'security: finalize strict production CORS policy'
          git push origin HEAD:main
