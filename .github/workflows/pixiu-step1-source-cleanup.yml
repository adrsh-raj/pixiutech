name: Pixiu Step 1 Source Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixiu-step1-source-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production-only source cleanup
        shell: python
        run: |
          from pathlib import Path

          path = Path('pixiu-lms-portal/server/index.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "const PORT = process.env.PORT || 5000;\nconst JWT_SECRET = process.env.JWT_SECRET || 'pixiu_super_secret_jwt_key_2026';",
              "const PORT = process.env.PORT || 10000;\nconst JWT_SECRET = process.env.JWT_SECRET;\n\nif (!JWT_SECRET || JWT_SECRET.trim().length < 32) {\n  throw new Error('JWT_SECRET must be configured with at least 32 characters.');\n}"
          )

          old_cors = """const allowedOrigins = [
  'http://localhost:5173',
  'http://localhost:5174',
  'http://localhost:3000',
  'https://portal.pixiutech.com',
  'https://pixiutech.com',
  'https://www.pixiutech.com'
];

app.use(cors({
  origin: function(origin, callback) {
    if (!origin || allowedOrigins.indexOf(origin) !== -1 
        || origin.startsWith('http://localhost:')
        || origin.endsWith('.vercel.app')
        || origin.endsWith('.onrender.com')
        || origin.endsWith('.pixiutech.com')) {
      callback(null, true);
    } else {
      callback(null, true); // Permissive for now
    }
  },
  credentials: true
}));"""
          new_cors = """const ALLOWED_ORIGINS = new Set([
  'https://pixiutech.com',
  'https://www.pixiutech.com',
  'https://portal.pixiutech.com'
]);

app.use(cors({
  origin(origin, callback) {
    if (!origin || ALLOWED_ORIGINS.has(origin)) return callback(null, true);
    return callback(new Error('Origin not allowed by CORS'));
  },
  credentials: true
}));"""
          text = text.replace(old_cors, new_cors)

          old_uploads = """const uploadsBase = (process.env.RENDER && fs.existsSync('/opt/render/project/src/data')) 
  ? '/opt/render/project/src/data/uploads' 
  : path.join(__dirname, 'uploads');
const uploadsDir = uploadsBase;"""
          new_uploads = """const uploadsDir = '/opt/render/project/src/data/uploads';"""
          text = text.replace(old_uploads, new_uploads)

          auth_boundary = """// Require a valid production JWT for all non-public API routes.
function requireAuth(req, res, next) {
  const authHeader = req.headers.authorization;
  if (!authHeader || !authHeader.startsWith('Bearer ')) {
    return res.status(401).json({ error: 'Unauthorized: No token provided' });
  }
  const token = authHeader.slice('Bearer '.length).trim();
  if (!token) return res.status(401).json({ error: 'Unauthorized: No token provided' });
  try {
    req.user = jwt.verify(token, JWT_SECRET);
    return next();
  } catch {
    return res.status(401).json({ error: 'Session expired or invalid' });
  }
}

app.use('/api', (req, res, next) => {
  if (req.path === '/health' || req.path === '/auth/login' || req.path === '/auth/me') return next();
  return requireAuth(req, res, next);
});

"""
          marker = "// File Upload Endpoint with validation\n"
          if auth_boundary not in text:
              text = text.replace(marker, auth_boundary + marker, 1)

          logout_marker = "});\n\n// ==================== 1. SCHOOLS API ===================="
          logout_route = "});\n\napp.post('/api/auth/logout', requireAuth, (req, res) => {\n  res.json({ success: true });\n});\n\n// ==================== 1. SCHOOLS API ===================="
          text = text.replace(logout_marker, logout_route, 1)

          # The production API is now the only backend authority.
          path.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          rm -f .github/workflows/pixiu-step1-source-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixiu-lms-portal/server/index.js .github/workflows/pixiu-step1-source-cleanup.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'security: finalize step 1 production source cleanup'
          git push
