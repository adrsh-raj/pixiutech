name: Pixiu Step 1 Source Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend source safely
        shell: python
        run: |
          from pathlib import Path

          p = Path('pixiu-lms-portal/server/index.js')
          text = p.read_text(encoding='utf-8')

          old_jwt = "const JWT_SECRET = process.env.JWT_SECRET || 'pixiu_super_secret_jwt_key_2026';"
          new_jwt = "const JWT_SECRET = process.env.JWT_SECRET;\nif (!JWT_SECRET || JWT_SECRET.trim().length < 32) {\n  throw new Error('JWT_SECRET must be configured with at least 32 characters.');\n}"
          if old_jwt not in text:
              raise SystemExit('Expected JWT fallback not found; refusing to modify index.js.')
          text = text.replace(old_jwt, new_jwt, 1)

          old_cors = '''// CORS Configuration
          const allowedOrigins = [
            'http://localhost:5173',
            'http://localhost:5174',
            'http://localhost:3000',
            'https://portal.pixiutech.com',
            'https://pixiutech.com',
            'https://www.pixiutech.com'
          ];

          app.use(cors({
            origin: function(origin, callback) {
              if (!origin || allowedOrigins.indexOf(origin) !== -1 
                  || origin.startsWith('http://localhost:')
                  || origin.endsWith('.vercel.app')
                  || origin.endsWith('.onrender.com')
                  || origin.endsWith('.pixiutech.com')) {
                callback(null, true);
              } else {
                callback(null, true); // Permissive for now
              }
            },
            credentials: true
          }));'''
          new_cors = '''// Production CORS: only the public Pixiu domains may call the API from a browser.
          const allowedOrigins = new Set([
            'https://portal.pixiutech.com',
            'https://pixiutech.com',
            'https://www.pixiutech.com'
          ]);

          app.use(cors({
            origin: function(origin, callback) {
              if (!origin || allowedOrigins.has(origin)) {
                return callback(null, true);
              }
              return callback(new Error('CORS origin denied'));
            },
            credentials: true
          }));'''
          if old_cors not in text:
              raise SystemExit('Expected CORS block not found; refusing to modify index.js.')
          text = text.replace(old_cors, new_cors, 1)

          marker = "// ==================== 1. SCHOOLS API ===================="
          auth_block = '''// Global API authentication boundary.
          // Login is intentionally public; every API route declared after this point requires a valid JWT.
          function requireAuth(req, res, next) {
            const authHeader = req.headers.authorization;
            if (!authHeader || !authHeader.startsWith('Bearer ')) {
              return res.status(401).json({ error: 'Unauthorized: No token provided' });
            }

            const token = authHeader.slice(7).trim();
            if (!token) {
              return res.status(401).json({ error: 'Unauthorized: No token provided' });
            }

            try {
              req.user = jwt.verify(token, JWT_SECRET);
              return next();
            } catch (err) {
              return res.status(401).json({ error: 'Session expired or invalid' });
            }
          }

          app.use('/api', requireAuth);

          // ==================== 1. SCHOOLS API ===================='''
          if marker not in text:
              raise SystemExit('Expected API marker not found; refusing to modify index.js.')
          text = text.replace(marker, auth_block, 1)

          # Move upload behind the auth boundary by removing the original public handler
          # and re-inserting it immediately after the global boundary.
          upload_start = "// File Upload Endpoint with validation\napp.post('/api/upload', (req, res) => {"
          start = text.find(upload_start)
          if start == -1:
              raise SystemExit('Expected upload endpoint not found; refusing to modify index.js.')
          end_marker = "\n});\n\n// In-Memory Login Attempt Tracker"
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Expected upload endpoint terminator not found; refusing to modify index.js.')
          upload_block = text[start:end + len("\n});")]
          text = text[:start] + text[end + len("\n});"):] 

          boundary_marker = "app.use('/api', requireAuth);\n\n          // ==================== 1. SCHOOLS API ===================="
          if boundary_marker not in text:
              raise SystemExit('Auth boundary marker not found after upload removal.')
          replacement = "app.use('/api', requireAuth);\n\n          " + upload_block.replace('\n', '\n          ') + "\n\n          // ==================== 1. SCHOOLS API ===================="
          text = text.replace(boundary_marker, replacement, 1)

          # The global boundary must not protect the public login endpoint; auth routes are above it.
          p.write_text(text, encoding='utf-8')
          print('index.js patched successfully; route body preserved.')
      - name: Verify source cleanup
        run: |
          ! grep -F "pixiu_super_secret_jwt_key_2026" pixiu-lms-portal/server/index.js
          ! grep -E "localhost|vercel\.app|onrender\.com|endsWith\('\.pixiutech\.com'\)" pixiu-lms-portal/server/index.js || true
          grep -F "const JWT_SECRET = process.env.JWT_SECRET;" pixiu-lms-portal/server/index.js
          grep -F "app.use('/api', requireAuth);" pixiu-lms-portal/server/index.js

      - name: Backend syntax check
        run: node --check pixiu-lms-portal/server/index.js

      - name: Frontend production build
        working-directory: pixiu-lms-portal
        run: npm ci && npm run build

      - name: Commit patched source
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixiu-lms-portal/server/index.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "security: finalize production LMS API boundary"
            git push
          fi
