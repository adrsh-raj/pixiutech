name: PIXIU Step 5-6 DB v6
on:
  push:
    paths:
      - '.github/step56-v6-trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixiu_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixiu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate PostgreSQL production layer
        run: python scripts/step56_patch.py
      - name: Install API dependencies
        working-directory: pixiu-lms-portal/server
        run: npm install
      - name: Verify migration with PostgreSQL client
        working-directory: pixiu-lms-portal/server
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixiu_test
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
          CORS_ORIGINS: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com
          DB_POOL_MAX: 5
          DB_STATEMENT_TIMEOUT_MS: 10000
        run: |
          node --check database.js
          node --check index.js
          node --check start.js
          node - <<'JS'
          const {Client}=require('pg');
          const c=new Client({connectionString:process.env.DATABASE_URL});
          (async()=>{await c.connect(); for(const table of ['users','schools','classes','students','trainers','sessions','attendance','billing','content','curriculum','inventory','leads','quizzes','quiz_questions','projects','notifications','student_reviews']){const r=await c.query(`select count(*)::int as count from "${table}"`); console.log(table,r.rows[0].count)}; const required={users:30,schools:2,classes:10,students:45,trainers:2,sessions:25,attendance:90,billing:3,content:40,curriculum:30,inventory:10,leads:2,quizzes:6,quiz_questions:30,projects:3,notifications:3,student_reviews:12}; for(const [t,n] of Object.entries(required)){const r=await c.query(`select count(*)::int as count from "${t}"`); if(r.rows[0].count!==n) throw new Error(`Count mismatch for ${t}: expected ${n}, got ${r.rows[0].count}`)}; await c.end(); console.log('POSTGRES MIGRATION DATA VERIFIED')})().catch(async e=>{console.error(e);try{await c.end()}catch{};process.exit(1)})
          JS
      - name: Verify production performance and safety
        run: |
          set -euo pipefail
          ! grep -RniE "http://localhost:|http://127\.0\.0\.1:|INSERT OR REPLACE|PRAGMA |new Database\(" pixiu-lms-portal/server --include='*.js'
          grep -q "const compression = require('compression');" pixiu-lms-portal/server/index.js
          grep -q "app.use(compression());" pixiu-lms-portal/server/index.js
          grep -q "DATABASE_URL" pixiu-lms-portal/server/start.js
          grep -q "fromDatabase:" pixiu-lms-portal/render.yaml
          grep -q "DB_POOL_MAX" pixiu-lms-portal/render.yaml
          grep -q "DB_STATEMENT_TIMEOUT_MS" pixiu-lms-portal/render.yaml
      - name: Build website and LMS
        run: |
          npm install
          npm run build
          cd pixiu-lms-portal
          npm install
          npm run build
      - name: Commit final Step 5-6 architecture and clean temporary tooling
        run: |
          rm -f .github/workflows/pixiustep56-db.yml .github/workflows/pixiustep56-db-v2.yml .github/workflows/pixiustep56-db-v3.yml .github/workflows/pixiustep56-db-v4.yml .github/workflows/pixiustep56-db-v5.yml .github/workflows/pixiustep56-db-v6.yml .github/workflows/pixiustep56-inspect.yml .github/workflows/pixiustep56-diag.yml .github/step56-trigger .github/step56-v2-trigger .github/step56-v3-trigger .github/step56-v4-trigger .github/step56-v5-trigger .github/step56-v6-trigger .github/step56-inspect-trigger .github/step56-diag-trigger scripts/step56_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate LMS persistence to PostgreSQL'
          git push origin HEAD:main
