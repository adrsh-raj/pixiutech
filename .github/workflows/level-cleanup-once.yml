name: one-time level cleanup
on:
  push:
    branches: [chore/remove-level-end-to-end]
permissions:
  contents: write
jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, 'LEVEL_CLEANUP_APPLIED')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Remove legacy level fields
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path('.')
          p=root/'pixiu-backend/learning/models.py'
          s=p.read_text()
          s=re.sub(r'^\s*level\s*=\s*models\.CharField\([^\n]*\)\n','',s,flags=re.M)
          s=s.replace('        ordering = ["grade", "level", "unit_code"]','        ordering = ["grade", "unit_code"]')
          s=re.sub(r'^\s*self\.level\s*=\s*str\(self\.level\)\.strip\(\)\n','',s,flags=re.M)
          p.write_text(s)
          p=root/'pixiu-backend/academics/models.py'
          s=p.read_text(); s=re.sub(r'^\s*current_level\s*=\s*models\.CharField\([^\n]*\)\n','',s,flags=re.M); p.write_text(s)
          for p in root.glob('pixiu-backend/**/*.py'):
            if '/migrations/' in str(p): continue
            s=p.read_text()
            s=re.sub(r',\s*"current_level"','',s); s=re.sub(r'"current_level"\s*,\s*','',s)
            s=re.sub(r',\s*"level"','',s); s=re.sub(r'"level"\s*,\s*','',s)
            p.write_text(s)
          p=root/'pixiu-lms-portal/src/utils/transcriptGenerator.js'
          s=p.read_text()
          s=re.sub(r'<div class="kpi"><div class="label">Current Level</div><b>.*?</b></div>','',s)
          s=s.replace('<th>Level</th>','').replace("student.current_level || 'Level 0'", "''")
          s=re.sub(r'<td>\$\{esc\(student\.current_level[^<]*\)</td>','',s)
          p.write_text(s)
          for p in root.glob('pixiu-lms-portal/src/**/*'):
            if not p.is_file() or p.suffix not in {'.js','.jsx','.ts','.tsx'}: continue
            s=p.read_text()
            s=re.sub(r',\s*(?:current_level|level)\s*:\s*[^,}\n]+','',s)
            p.write_text(s)
      - name: Add migrations
        shell: bash
        run: |
          cat > pixiu-backend/learning/migrations/0008_remove_legacy_level_fields.py <<'PY'
          from django.db import migrations
          class Migration(migrations.Migration):
              dependencies=[('learning','0007_assessment_uniqueness')]
              operations=[migrations.RemoveField(model_name='curriculumunit',name='level'),migrations.RemoveField(model_name='learningcontent',name='level'),migrations.RemoveField(model_name='quiz',name='level'),migrations.RemoveField(model_name='studentassessment',name='level')]
          PY
          cat > pixiu-backend/academics/migrations/0002_remove_student_current_level.py <<'PY'
          from django.db import migrations
          class Migration(migrations.Migration):
              dependencies=[('academics','0001_initial')]
              operations=[migrations.RemoveField(model_name='student',name='current_level')]
          PY
      - name: Validate and push
        working-directory: pixiu-backend
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          if grep -RInE '\b(current_level|level)\b' . --include='*.py' --exclude-dir=migrations --exclude-dir=__pycache__ | grep -v 'reorder_level'; then exit 1; fi
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixiu-backend pixiu-lms-portal/src
          git commit -m 'Remove legacy level fields end to end [LEVEL_CLEANUP_APPLIED]'
          git push origin HEAD:chore/remove-level-end-to-end
