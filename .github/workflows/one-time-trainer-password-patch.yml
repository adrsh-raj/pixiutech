name: One-time Trainer Password Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'adrsh-raj'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch trainer creation password field
        env:
          FILE: pixiu-lms-portal/src/pages/Trainers.jsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pixiu-lms-portal/src/pages/Trainers.jsx")
          text = path.read_text(encoding="utf-8")

          if "password: ''" in text:
              print("Trainer password field already patched; nothing to do.")
              raise SystemExit(0)

          replacements = [
              (
                  "    rating: 5.0,\n    status: 'Active'\n  });",
                  "    rating: 5.0,\n    status: 'Active',\n    password: ''\n  });",
              ),
              (
                  "      status: formData.status\n    });",
                  "      status: formData.status,\n      password: formData.password\n    });",
              ),
              (
                  "      <div className=\"mt-6 flex justify-end gap-3 pt-2 border-t border-slate-100\">",
                  """      <div className=\"bg-blue-50 border border-blue-200 rounded-xl p-4\">\n                <p className=\"text-[11px] font-bold text-blue-800 uppercase tracking-wider mb-2\">Create Trainer Password</p>\n                <input\n                  type=\"password\"\n                  value={formData.password}\n                  onChange={e => setFormData({ ...formData, password: e.target.value })}\n                  placeholder=\"Minimum 12 characters\"\n                  minLength={12}\n                  required\n                  autoComplete=\"new-password\"\n                  className=\"w-full px-3 py-2 border border-blue-200 rounded-lg text-sm bg-white focus:outline-none focus:border-pixiu-blue\"\n                />\n                <p className=\"text-[11px] text-slate-500 mt-1.5\">Admin sets the trainer portal password. It is hashed server-side and never displayed after creation.</p>\n              </div>\n\n              <div className=\"mt-6 flex justify-end gap-3 pt-2 border-t border-slate-100\">""",
              ),
              (
                  "      status: 'Active'\n    });\n  };",
                  "      status: 'Active',\n      password: ''\n    });\n  };",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Required patch target not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("Trainer password creation UI patched successfully.")
          PY

      - name: Verify patch
        run: |
          grep -q "Create Trainer Password" pixiu-lms-portal/src/pages/Trainers.jsx
          grep -q "password: formData.password" pixiu-lms-portal/src/pages/Trainers.jsx

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixiu-lms-portal/src/pages/Trainers.jsx
          git rm .github/workflows/one-time-trainer-password-patch.yml
          git commit -m "feat: add trainer password creation field"
          git push
