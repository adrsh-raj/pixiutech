name: PIXIU Step 3 Repair

on:
  push:
    paths:
      - '.github/step3-repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final security patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pixiu-lms-portal/server/middleware
          cat > pixiu-lms-portal/server/middleware/authorization.js <<'EOF'
          const READ_ONLY = new Set(['GET', 'HEAD', 'OPTIONS']);
          const ADMIN_ONLY = ['/leads', '/billing', '/audit-logs', '/trainers'];
          const pathMatches = (path, prefixes) => prefixes.some(p => path === p || path.startsWith(`${p}/`));
          const same = (a, b) => a != null && b != null && String(a).trim() === String(b).trim();
          const forbidden = (res, message) => res.status(403).json({ error: message || 'Forbidden' });

          function scopeResponse(res, scope) {
            const original = res.json.bind(res);
            res.json = (payload) => {
              if (!Array.isArray(payload) || scope.role === 'admin') return original(payload);
              const rows = payload.filter(row => {
                if (!row || typeof row !== 'object') return true;
                if (scope.role === 'student') {
                  if (row.student_id != null) return same(row.student_id, scope.studentId);
                  if (row.school_id != null) return same(row.school_id, scope.schoolId);
                  return true;
                }
                if (row.school_id != null) return same(row.school_id, scope.schoolId);
                if (row.target_school_id != null) return same(row.target_school_id, scope.schoolId);
                if (row.student_id != null) return scope.studentIds.has(String(row.student_id));
                return true;
              });
              return original(rows);
            };
          }

          function authorizationMiddleware(db) {
            return async (req, res, next) => {
              const user = req.user;
              const role = user?.role;
              const route = req.path;
              if (!user || !role) return forbidden(res, 'Authenticated role is required');
              if (role === 'admin') return next();
              if (!['trainer', 'school', 'student'].includes(role)) return forbidden(res, 'Unsupported role');
              if (pathMatches(route, ADMIN_ONLY)) return forbidden(res, 'Administrator access required');

              if (role === 'student') {
                const readable = ['/students', '/classes', '/sessions', '/attendance', '/content', '/curriculum', '/projects', '/reviews', '/notifications', '/quizzes', '/quiz-submissions'];
                const canRead = READ_ONLY.has(req.method) && pathMatches(route, readable);
                const canSubmit = req.method === 'POST' && pathMatches(route, ['/quiz-submissions']);
                if (!canRead && !canSubmit) return forbidden(res, 'Students are not permitted to modify this resource');
                const studentId = user.related_id || user.username;
                const schoolId = user.school_id || null;
                if (route.startsWith('/students/')) {
                  const id = decodeURIComponent(route.split('/')[2] || '');
                  if (!same(id, studentId)) return forbidden(res, 'Students can access only their own profile');
                }
                if (req.body?.student_id && !same(req.body.student_id, studentId)) return forbidden(res, 'Student scope violation');
                if (req.body?.school_id && schoolId && !same(req.body.school_id, schoolId)) return forbidden(res, 'School scope violation');
                scopeResponse(res, { role, studentId, schoolId, studentIds: new Set([String(studentId)]) });
                return next();
              }

              if (!user.school_id) return forbidden(res, 'School scope is required for this account');
              const schoolId = String(user.school_id);
              const studentIds = new Set();
              await new Promise(resolve => db.all('SELECT student_id FROM students WHERE school_id = ?', [schoolId], (err, rows = []) => {
                if (!err) rows.forEach(row => studentIds.add(String(row.student_id)));
                resolve();
              }));

              if (role === 'school' && pathMatches(route, ['/trainers', '/leads', '/billing', '/comms'])) return forbidden(res, 'Restricted for school accounts');
              if (role === 'trainer' && pathMatches(route, ['/trainers'])) return forbidden(res, 'Trainer management is restricted to administrators');

              const bodySchool = req.body?.school_id || req.query?.school_id;
              if (bodySchool && !same(bodySchool, schoolId)) return forbidden(res, 'Cross-school access is not permitted');
              if (req.body?.student_id && !studentIds.has(String(req.body.student_id))) return forbidden(res, 'Student is outside your school scope');

              if (route.startsWith('/students/')) {
                const id = decodeURIComponent(route.split('/')[2] || '');
                if (!studentIds.has(String(id))) return forbidden(res, 'Student is outside your school scope');
              }
              if (route.startsWith('/schools/')) {
                const id = decodeURIComponent(route.split('/')[2] || '');
                if (!same(id, schoolId)) return forbidden(res, 'School is outside your account scope');
              }
              if (role === 'school' && !READ_ONLY.has(req.method) && !pathMatches(route, ['/attendance', '/notifications', '/reviews', '/quiz-submissions'])) return forbidden(res, 'School account is read-only for this resource');

              scopeResponse(res, { role, schoolId, studentIds });
              return next();
            };
          }
          module.exports = { authorizationMiddleware };
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('pixiu-lms-portal/server/index.js')
          t = p.read_text()
          if "./middleware/authorization" not in t:
              t = t.replace("const db = require('./database');\n", "const db = require('./database');\nconst { authorizationMiddleware } = require('./middleware/authorization');\n", 1)
          t = t.replace("// Production CORS: only the official Pixiu browser origins are allowed.\nconst allowedOrigins = new Set([\n  'https://portal.pixiutech.com',\n  'https://pixiutech.com',\n  'https://www.pixiutech.com'\n]);\n", "const configuredOrigins = (process.env.CORS_ORIGINS || '').split(',').map(v => v.trim()).filter(Boolean);\nif (!configuredOrigins.length) throw new Error('CORS_ORIGINS must be configured for the Pixiu LMS API.');\nconst allowedOrigins = new Set(configuredOrigins);\n", 1)
          t = t.replace("{ expiresIn: '7d' }", "{ expiresIn: '12h' }", 1)
          if "const requestedRole" not in t:
              t = t.replace("  const cleanUsername = username.trim();\n", "  const cleanUsername = username.trim();\n  const requestedRole = typeof req.body?.role === 'string' ? req.body.role.trim().toLowerCase() : '';\n", 1)
          role_block = "    const isMatch = await bcrypt.compare(password, user.password_hash);\n    if (!isMatch) {\n      return res.status(401).json({ error: 'Invalid ID / Username or Password' });\n    }\n\n    // Sign JWT Token\n"
          if role_block in t:
              t = t.replace(role_block, "    const isMatch = await bcrypt.compare(password, user.password_hash);\n    if (!isMatch) {\n      return res.status(401).json({ error: 'Invalid ID / Username or Password' });\n    }\n    if (requestedRole && user.role !== requestedRole) {\n      return res.status(403).json({ error: 'This account is not permitted to use the selected login type.' });\n    }\n\n    // Sign JWT Token\n", 1)
          if "app.use('/api', authorizationMiddleware(db));" not in t:
              t = t.replace("app.use('/api', requireAuth);", "app.use('/api', requireAuth);\napp.use('/api', authorizationMiddleware(db));", 1)

          # Student account creation: use a secure generated temporary password only when caller omits one.
          old = "const studentPassword = password || 'student123';"
          if old in t:
              t = t.replace(old, "const studentPassword = password || require('crypto').randomBytes(18).toString('base64url');", 1)
              t = t.replace("res.json({ success: true, student_id, school_id, class_id, name, parent_name, parent_whatsapp, tech_level });", "res.json({ success: true, student_id, school_id, class_id, name, parent_name, parent_whatsapp, tech_level, temporary_password: password ? null : studentPassword });", 1)
          p.write_text(t)

          s = Path('pixiu-lms-portal/server/start.js')
          st = s.read_text()
          if 'CORS_ORIGINS' not in st:
              st = st.replace("if (process.env.NODE_ENV !== 'production') {", "if (!process.env.CORS_ORIGINS || !process.env.CORS_ORIGINS.trim()) throw new Error('CORS_ORIGINS must be configured before the Pixiu LMS API can start.');\n\nif (process.env.NODE_ENV !== 'production') {", 1)
          s.write_text(st)

          r = Path('pixiu-lms-portal/render.yaml')
          rt = r.read_text()
          if 'key: CORS_ORIGINS' not in rt:
              rt = rt.replace("      - key: JWT_SECRET\n        generateValue: true\n", "      - key: JWT_SECRET\n        generateValue: true\n      - key: CORS_ORIGINS\n        value: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com\n", 1)
          r.write_text(rt)

          st = Path('pixiu-lms-portal/src/pages/Students.jsx')
          x = st.read_text()
          x = x.replace("const isTrainer = role === 'trainer';\n  const trainerSchoolId = user?.school_id || (user?.username === 'akashsharma' || user?.related_id === 'TR-02' ? 'XYZ' : 'ZPS');", "const isTrainer = role === 'trainer';\n  const trainerSchoolId = user?.school_id || '';", 1)
          # Show a generated temporary password to the admin only after a new student is created without one.
          x = x.replace("    await addStudent({", "    const result = await addStudent({", 1)
          x = x.replace("    toast.success(`Student ${formData.name} enrolled with ID \"${newId}\"!`, 'Student Registered');", "    if (!result?.success) {\n      toast.error(result?.error || 'Student registration failed.');\n      return;\n    }\n    const tempPassword = result?.data?.temporary_password;\n    toast.success(tempPassword ? `Student ${formData.name} enrolled. Temporary login password: ${tempPassword}` : `Student ${formData.name} enrolled with ID \\\"${newId}\\\"!`, 'Student Registered');", 1)
          st.write_text(x)

          # User-specific cache namespace prevents one account from reusing another account's cached records.
          d = Path('pixiu-lms-portal/src/context/DataContext.jsx')
          dt = d.read_text()
          if 'const cacheScope =' not in dt:
              dt = dt.replace("const readCache = (key, fallback) => {", "const cacheScope = (() => {\n  try {\n    const raw = localStorage.getItem('pixiu_auth_user');\n    const user = raw ? JSON.parse(raw) : null;\n    return String(user?.id || user?.username || 'guest').replace(/[^a-zA-Z0-9_-]/g, '_');\n  } catch { return 'guest'; }\n})();\nconst scopedKey = key => `${key}:${cacheScope}`;\n\nconst readCache = (key, fallback) => {", 1)
              dt = dt.replace("localStorage.getItem(key);", "localStorage.getItem(scopedKey(key));", 1)
              dt = dt.replace("localStorage.setItem(key, JSON.stringify(value));", "localStorage.setItem(scopedKey(key), JSON.stringify(value));", 1)
              d.write_text(dt)

          a = Path('pixiu-lms-portal/src/context/AuthContext.jsx')
          at = a.read_text()
          marker = "      localStorage.removeItem(USER_KEY);\n      window.dispatchEvent(new Event('pixiu_auth_state_changed'));"
          if marker in at and 'key.includes(\':\')' not in at:
              at = at.replace(marker, "      localStorage.removeItem(USER_KEY);\n      Object.keys(localStorage).filter(key => key.startsWith('pixiu_') && key.includes(':')).forEach(key => localStorage.removeItem(key));\n      window.dispatchEvent(new Event('pixiu_auth_state_changed'));", 1)
              a.write_text(at)

          # Remove legacy auth wording; these are seed/UI labels, not cryptographic operations.
          for fp in [Path('pixiu-lms-portal/src/data/seedData.js'), Path('pixiu-lms-portal/src/pages/AuditLogs.jsx')]:
              if fp.exists(): fp.write_text(fp.read_text().replace('Authenticated (SHA-256)', 'Authenticated').replace('Verified (SHA-256)', 'Verified'))
          PY

          # Hard fail on legacy browser authentication and local runtime URLs.
          if grep -RniE "student123|hub_authenticated|http://localhost|http://127\.0\.0\.1|https://localhost" src pixiu-lms-portal/src pixiu-lms-portal/server 2>/dev/null; then
            echo 'Legacy browser auth/default credential/localhost runtime marker detected.'
            exit 1
          fi

          node --check pixiu-lms-portal/server/index.js
          node --check pixiu-lms-portal/server/start.js
          node --check pixiu-lms-portal/server/middleware/authorization.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pixiu-lms-portal/server/middleware/authorization.js pixiu-lms-portal/server/index.js pixiu-lms-portal/server/start.js pixiu-lms-portal/render.yaml pixiu-lms-portal/src/pages/Students.jsx pixiu-lms-portal/src/context/DataContext.jsx pixiu-lms-portal/src/context/AuthContext.jsx pixiu-lms-portal/src/data/seedData.js pixiu-lms-portal/src/pages/AuditLogs.jsx
          git commit -m 'security: enforce roles and production tenant scope' || exit 0
          git push origin HEAD:main
