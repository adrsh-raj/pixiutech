name: PIXIU CyberLab Browser Gate

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - fix/ai-lab-phase-0-3-end-to-end
    paths:
      - "pixiu-lms-portal/**"
      - "scripts/cyberlab-browser-gate.mjs"
      - ".github/workflows/cyberlab-browser-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Build Virtual Lab
        working-directory: pixiu-lms-portal
        run: |
          npm ci
          npm run test:lab
          npm run test:copilot
          npm run build

      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start preview
        working-directory: pixiu-lms-portal
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/pixiu-cyberlab.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/simulation >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/pixiu-cyberlab.log
          exit 1

      - name: Run browser gate
        env:
          CYBERLAB_BASE_URL: "http://127.0.0.1:4173"
          CYBERLAB_ARTIFACT_DIR: "artifacts/cyberlab-browser"
        run: node scripts/cyberlab-browser-gate.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixiu-cyberlab-browser-evidence
          path: artifacts/cyberlab-browser
          if-no-files-found: ignore
