name: PIXIU Step 4 CORS Hardening

on:
  push:
    paths:
      - '.github/step4-trigger'

permissions:
  contents: write

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CORS hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('pixiu-lms-portal/server/index.js')
          text = index.read_text()
          text = text.replace("const { authorizationMiddleware } = require('./middleware/authorization');", "const { authorizationMiddleware } = require('./middleware/authorization');\nconst { buildCorsOptions } = require('./middleware/cors');", 1)

          cors_block = re.compile(r"const configuredOrigins = \(process\.env\.CORS_ORIGINS \|\| ''\).*?app\.use\(cors\(\{.*?\}\)\);\n", re.S)
          replacement = "const corsOptions = buildCorsOptions();\napp.use(cors(corsOptions));\n"
          if not cors_block.search(text):
              raise SystemExit('Existing inline CORS block not found')
          text = cors_block.sub(replacement, text, count=1)
          index.write_text(text)

          # Keep the production entrypoint fail-closed on missing CORS config.
          start = Path('pixiu-lms-portal/server/start.js')
          st = start.read_text()
          if 'CORS_ORIGINS' not in st:
              raise SystemExit('start.js CORS guard missing')

          # Remove this one-shot workflow and trigger after the production change is committed.
          workflow = Path('.github/workflows/pixiustep4-cors.yml')
          trigger = Path('.github/step4-trigger')
          git_files = [index, Path('pixiu-lms-portal/server/middleware/cors.js'), Path('pixiu-lms-portal/server/.env.example'), workflow, trigger]

          # Prevent a permissive wildcard or localhost origin from entering production config.
          render = Path('pixiu-lms-portal/render.yaml').read_text()
          if '*' in render or 'localhost' in render.lower() or '127.0.0.1' in render:
              raise SystemExit('Unsafe CORS origin found in render.yaml')
          if 'key: CORS_ORIGINS' not in render:
              raise SystemExit('CORS_ORIGINS missing from Render configuration')

          Path('/tmp/verify-cors.js').write_text(r"""
          const { buildCorsOptions, normalizeOrigins } = require('./pixiu-lms-portal/server/middleware/cors');
          const origins = normalizeOrigins('https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com');
          if (origins.length !== 3) throw new Error('Expected exactly three production origins');
          if (origins.some(o => o === '*' || /localhost|127\\.0\\.0\\.1/i.test(o))) throw new Error('Unsafe origin accepted');
          const opts = buildCorsOptions({ CORS_ORIGINS: origins.join(',') });
          if (opts.credentials !== false) throw new Error('Credentials must remain disabled for bearer-token CORS');
          opts.origin('https://portal.pixiutech.com', (err, allowed) => {
            if (err || allowed !== true) throw new Error('Official origin was not allowed');
          });
          opts.origin('https://evil.example', (err, allowed) => {
            if (err || allowed !== false) throw new Error('Untrusted origin was allowed');
          });
          console.log('CORS policy assertions passed');
          """)

          # Commit before removing the workflow file, so the final main tree contains only the durable policy.
          import subprocess
          subprocess.run(['node', '/tmp/verify-cors.js'], check=True)
          subprocess.run(['node', '--check', str(index)], check=True)
          subprocess.run(['node', '--check', 'pixiu-lms-portal/server/middleware/cors.js'], check=True)

          workflow.unlink()
          trigger.unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', *map(str, git_files)], check=True)
          subprocess.run(['git', 'commit', '-m', 'security: harden production CORS policy'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
