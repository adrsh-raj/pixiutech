name: PIXIU Step 5-6 Database Migration v3

on:
  push:
    paths:
      - '.github/step56-v3-trigger'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixiu_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixiu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair deterministic schema extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/step56_patch.py')
          s = p.read_text()
          start = s.index('# Extract the live SQLite CREATE TABLE definitions before replacing the adapter.')
          end = s.index('DATABASE_JS =', start)
          replacement = '''# Extract the live SQLite schema directly from the committed source database.\n          import sqlite3\n          sqlite_path = SERVER / 'pixiu_lms.db'\n          if not sqlite_path.exists():\n              raise SystemExit('Committed SQLite migration source is missing.')\n          sqlite = sqlite3.connect(sqlite_path)\n          rows = sqlite.execute("SELECT sql FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name").fetchall()\n          sqlite.close()\n          blocks = [row[0] for row in rows if row[0] and row[0].upper().startswith('CREATE TABLE')]\n          if len(blocks) < 15:\n              raise SystemExit(f'Expected at least 15 SQLite tables; found {len(blocks)}')\n\n          schema_parts = []\n          for block in blocks:\n              sql = block.replace('DATETIME', 'TIMESTAMPTZ')\n              sql = sql.replace('INTEGER PRIMARY KEY AUTOINCREMENT', 'BIGSERIAL PRIMARY KEY')\n              schema_parts.append(sql.strip() + ';')\n\n          indexes = '''\n          CREATE INDEX IF NOT EXISTS idx_users_school_role ON users (school_id, role);\n          CREATE INDEX IF NOT EXISTS idx_classes_school ON classes (school_id);\n          CREATE INDEX IF NOT EXISTS idx_students_school_class ON students (school_id, class_id);\n          CREATE INDEX IF NOT EXISTS idx_sessions_school_date ON sessions (school_id, date);\n          CREATE INDEX IF NOT EXISTS idx_sessions_class_date ON sessions (class_id, date);\n          CREATE INDEX IF NOT EXISTS idx_attendance_student ON attendance (student_id);\n          CREATE INDEX IF NOT EXISTS idx_attendance_session ON attendance (session_id);\n          CREATE INDEX IF NOT EXISTS idx_leads_stage ON leads (stage);\n          CREATE INDEX IF NOT EXISTS idx_content_grade_level ON content (class_grade, level);\n          CREATE INDEX IF NOT EXISTS idx_inventory_school_status ON inventory (school_id, status);\n          CREATE INDEX IF NOT EXISTS idx_inventory_student ON inventory (assigned_student_id);\n          CREATE INDEX IF NOT EXISTS idx_billing_school_status ON billing (school_id, status);\n          CREATE INDEX IF NOT EXISTS idx_comms_student_sent ON comms_logs (student_id, sent_at);\n          CREATE INDEX IF NOT EXISTS idx_projects_student ON projects (student_id);\n          CREATE INDEX IF NOT EXISTS idx_alerts_read_created ON alerts (is_read, created_at);\n          CREATE INDEX IF NOT EXISTS idx_notifications_school_status ON notifications (target_school_id, status);\n          CREATE INDEX IF NOT EXISTS idx_notifications_schedule ON notifications (scheduled_date, scheduled_time);\n          CREATE INDEX IF NOT EXISTS idx_audit_user_created ON audit_logs (user_id, created_at);\n          CREATE INDEX IF NOT EXISTS idx_audit_school_created ON audit_logs (school_id, created_at);\n          CREATE INDEX IF NOT EXISTS idx_reviews_student_created ON student_reviews (student_id, created_at);\n          CREATE INDEX IF NOT EXISTS idx_notification_reads_user ON notification_reads (user_key, created_at);\n          CREATE INDEX IF NOT EXISTS idx_quiz_questions_quiz_order ON quiz_questions (quiz_id, question_order);\n          CREATE INDEX IF NOT EXISTS idx_quiz_submissions_student ON quiz_submissions (student_id, completed_at);\n          '''\n          (SERVER / 'schema.sql').write_text('\\n\\n'.join(schema_parts) + '\\n\\n' + indexes.strip() + '\\n')\n\n          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python scripts/step56_patch.py

      - name: Install API dependencies and refresh lockfile
        working-directory: pixiu-lms-portal/server
        run: npm install

      - name: Validate PostgreSQL schema and data migration
        working-directory: pixiu-lms-portal/server
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixiu_test
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
          CORS_ORIGINS: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com
          DB_POOL_MAX: 5
          DB_STATEMENT_TIMEOUT_MS: 10000
        run: |
          node --check database.js
          node --check index.js
          node --check start.js
          node - <<'JS'
          const db = require('./database');
          (async () => {
            await db.ready;
            const tables = await db.all("SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT LIKE 'pg_%'");
            const required = ['users','schools','classes','students','trainers','sessions','attendance','billing','quizzes','quiz_questions','quiz_submissions','audit_logs'];
            const names = new Set(tables.map(row => row.tablename));
            const missing = required.filter(name => !names.has(name));
            if (missing.length) throw new Error(`Missing PostgreSQL tables: ${missing.join(', ')}`);
            const students = await db.get('SELECT COUNT(*)::int AS count FROM students');
            const users = await db.get('SELECT COUNT(*)::int AS count FROM users');
            const schools = await db.get('SELECT COUNT(*)::int AS count FROM schools');
            if ((students?.count || 0) < 1 || (users?.count || 0) < 1 || (schools?.count || 0) < 1) throw new Error('SQLite → PostgreSQL migration did not preserve core data.');
            console.log(`PostgreSQL verification passed: ${students.count} students, ${users.count} users, ${schools.count} schools, ${names.size} tables.`);
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Validate production runtime
        run: |
          set -euo pipefail
          ! grep -RniE "http://localhost:|http://127\.0\.0\.1:|INSERT OR REPLACE|PRAGMA |new Database\(" pixiu-lms-portal/server --include='*.js'
          grep -q "const compression = require('compression');" pixiu-lms-portal/server/index.js
          grep -q "app.use(compression());" pixiu-lms-portal/server/index.js
          grep -q "DATABASE_URL" pixiu-lms-portal/server/start.js
          grep -q "fromDatabase:" pixiu-lms-portal/render.yaml

      - name: Build frontend applications
        run: |
          npm install
          npm run build
          cd pixiu-lms-portal
          npm install
          npm run build

      - name: Commit final Step 5-6 changes and clean runners
        run: |
          rm -f .github/workflows/pixiustep56-db.yml .github/workflows/pixiustep56-db-v2.yml .github/workflows/pixiustep56-db-v3.yml .github/step56-trigger .github/step56-v2-trigger .github/step56-v3-trigger scripts/step56_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate LMS persistence to PostgreSQL' || true
          git push origin HEAD:main
