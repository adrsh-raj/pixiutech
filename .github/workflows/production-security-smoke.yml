name: PIXIU Production Security Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Frontend URL"
        required: false
        default: "https://www.pixiutech.com"
      portal_url:
        description: "Portal URL"
        required: false
        default: "https://portal.pixiutech.com"
      api_url:
        description: "Django API base including /api/v1"
        required: false
        default: "https://pixiu-django-api.onrender.com/api/v1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONTEND_URL: ${{ inputs.frontend_url || 'https://www.pixiutech.com' }}
      PORTAL_URL: ${{ inputs.portal_url || 'https://portal.pixiutech.com' }}
      API_URL: ${{ inputs.api_url || 'https://pixiu-django-api.onrender.com/api/v1' }}

    steps:
      - name: Public frontend availability
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$FRONTEND_URL/careers" -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html
          grep -qi 'Careers' /tmp/frontend.html

      - name: Core public pages
        run: |
          set -euo pipefail
          for path in /privacy /verify /terms; do
            curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$FRONTEND_URL$path" -o /tmp/page.html
            grep -qi '<html' /tmp/page.html
          done

      - name: Frontend security headers
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 --retry-delay 2 --max-time 30 "$FRONTEND_URL/" | tr -d '\r' | tee /tmp/frontend.headers
          grep -qi '^strict-transport-security:' /tmp/frontend.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/frontend.headers
          grep -qi '^x-frame-options: DENY' /tmp/frontend.headers
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/frontend.headers
          grep -qi '^content-security-policy:' /tmp/frontend.headers

      - name: Portal security headers
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 --retry-delay 2 --max-time 30 "$PORTAL_URL/simulation" | tr -d '\r' | tee /tmp/portal.headers
          grep -qi '^strict-transport-security:' /tmp/portal.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/portal.headers
          grep -qi '^x-frame-options: DENY' /tmp/portal.headers
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/portal.headers
          grep -qi '^content-security-policy:' /tmp/portal.headers

      - name: Django health
        run: |
          set -euo pipefail
          body="$(curl -fsSL --retry 4 --retry-delay 2 --max-time 45 -H 'Accept: application/json' "$API_URL/health/")"
          echo "$body"
          echo "$body" | jq -e '.status == "ok"' >/dev/null

      - name: Public career openings
        run: |
          set -euo pipefail
          body="$(curl -fsSL --retry 4 --retry-delay 2 --max-time 45 -H 'Accept: application/json' "$API_URL/public/careers/openings")"
          echo "$body"
          echo "$body" | jq -e 'type == "array"' >/dev/null

      - name: Certificate validation
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cert.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Accept: application/json' "$API_URL/public/certificates/verify")"
          test "$status" = "400"
          jq -e '.verified == false and .status == "invalid_request"' /tmp/cert.json >/dev/null

      - name: Public enquiry validation
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/enquiry.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "$API_URL/public/enquiries" --data '{}')"
          test "$status" = "400"
          jq -e '.success == false and (.error | length) > 0' /tmp/enquiry.json >/dev/null

      - name: Career application validation
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/career.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Accept: application/json' -X POST "$API_URL/public/careers/apply" -F 'name=Security Smoke Test' -F 'email=security-smoke@example.com' -F 'phone=9876543210')"
          test "$status" = "400"
          jq -e '.success == false or .error != null or .detail != null or .fields != null' /tmp/career.json >/dev/null

      - name: CORS policy
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 --retry-delay 2 --max-time 30             -H 'Origin: https://www.pixiutech.com'             "$API_URL/health/" | tr -d '\r' | tee /tmp/cors.headers
          if grep -qi '^access-control-allow-origin:' /tmp/cors.headers; then
            grep -qi '^access-control-allow-origin: https://www.pixiutech.com$' /tmp/cors.headers
          fi
