name: PIXIU Production Security Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      frontend_url:
        description: "Frontend URL"
        required: false
        default: "https://www.pixiutech.com"
      api_url:
        description: "Django API base including /api/v1"
        required: false
        default: "https://pixiu-django-api.onrender.com/api/v1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: ${{ inputs.frontend_url || 'https://www.pixiutech.com' }}
      API_URL: ${{ inputs.api_url || 'https://pixiu-django-api.onrender.com/api/v1' }}

    steps:
      - name: Frontend availability
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -D /tmp/frontend.headers "$FRONTEND_URL/careers" -o /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html
          grep -qi 'Careers' /tmp/frontend.html
          echo "PASS frontend: $FRONTEND_URL/careers"

      - name: Core privacy pages availability
        run: |
          set -euo pipefail
          for path in /privacy /verify; do
            curl -fsSL --retry 3 --retry-delay 2 --max-time 30 -o /tmp/page.html "$FRONTEND_URL$path"
            grep -qi '<html' /tmp/page.html
            echo "PASS frontend: $FRONTEND_URL$path"
          done

      - name: Frontend security headers
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 --retry-delay 2 --max-time 30 "$FRONTEND_URL/" | tr -d '\r' | tee /tmp/headers.txt
          for h in strict-transport-security x-content-type-options x-frame-options referrer-policy; do
            if ! grep -qi "^$h:" /tmp/headers.txt; then
              echo "FAIL missing required security header: $h"
              exit 1
            fi
          done
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains; preload

      - name: Static frontend secret scan
        env:
          FRONTEND_URL: ${{ inputs.frontend_url || 'https://www.pixiutech.com' }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 "$FRONTEND_URL/" -o /tmp/index.html
          python - <<'PY'
          import re, urllib.parse, urllib.request, os
          html=open('/tmp/index.html','r',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          urls=[urllib.parse.urljoin(os.environ['FRONTEND_URL']+'/', s) for s in srcs if not s.startswith('data:')][:30]
          for url in urls:
              try:
                  data=urllib.request.urlopen(url, timeout=20).read().decode('utf-8','ignore')
              except Exception:
                  continue
              bad=re.search(r'(SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|sb_secret_|service_role)', data, re.I)
              if bad:
                  raise SystemExit(f"SECRET-LIKE TOKEN FOUND IN FRONTEND BUNDLE: {url}")
          print(f"Scanned {len(urls)} frontend script bundle(s); no known Supabase service-key markers found.")
          PY

      - name: Django health
        run: |
          set -euo pipefail
          body="$(curl -fsSL --retry 4 --retry-delay 2 --max-time 45 -H 'Accept: application/json' "$API_URL/health/")"
          echo "$body"
          echo "$body" | jq -e '.status == "ok"' >/dev/null
          echo "PASS Django health"

      - name: Public careers read path
        run: |
          set -euo pipefail
          body="$(curl -fsSL --retry 4 --retry-delay 2 --max-time 45 -H 'Accept: application/json' "$API_URL/public/careers/openings")"
          echo "$body"
          echo "$body" | jq -e 'type == "array"' >/dev/null
          echo "PASS public career openings"

      - name: Public certificate validation path
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cert.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Accept: application/json' "$API_URL/public/certificates/verify")"
          test "$status" = "400"
          jq -e '.verified == false and .status == "invalid_request"' /tmp/cert.json >/dev/null
          echo "PASS certificate endpoint rejects missing credential safely (HTTP 400)"

      - name: Public enquiry validation path
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/enquiry.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "$API_URL/public/enquiries" --data '{}')"
          test "$status" = "400"
          jq -e '.success == false and (.error | length) > 0' /tmp/enquiry.json >/dev/null
          echo "PASS enquiry validation rejects incomplete input (HTTP 400)"

      - name: Career application validation path
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/career.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 -H 'Accept: application/json' -X POST "$API_URL/public/careers/apply" -F 'name=Security Smoke Test' -F 'email=security-smoke@example.com' -F 'phone=9876543210')"
          test "$status" = "400"
          jq -e '.success == false or .error != null or .detail != null or .fields != null' /tmp/career.json >/dev/null
          echo "PASS career application rejects missing CV without 5xx (HTTP 400)"

      - name: Public CORS policy check
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 --retry-delay 2 --max-time 30 \
            -H 'Origin: https://www.pixiutech.com' \
            "$API_URL/health/" | tr -d '\r' | tee /tmp/cors.txt
          if grep -qi '^access-control-allow-origin:' /tmp/cors.txt; then
            grep -qi '^access-control-allow-origin: https://www.pixiutech.com$' /tmp/cors.txt
            echo "PASS CORS allows the Pixiu website origin"
          else
            echo "WARN CORS header not present on health endpoint"
          fi
 /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff

