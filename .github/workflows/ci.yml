name: PIXIU Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pixiu
          POSTGRES_PASSWORD: pixiu
          POSTGRES_DB: pixiu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixiu -d pixiu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clamav:
        image: clamav/clamav:1.5.4-debian13-slim
        ports:
          - 3310:3310
        env:
          CLAMD_CONF_StreamMaxLength: 30M
          CLAMD_CONF_ConcurrentDatabaseReload: "no"
          CLAMD_CONF_MaxThreads: "4"
          FRESHCLAM_CHECKS: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pixiu-backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: pixiu-lms-portal/.node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pixiu-lms-portal/package-lock.json

      - name: Wait for ClamAV
        working-directory: pixiu-backend
        run: |
          python - <<'PY'
          import socket
          import time
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 3310), timeout=2) as sock:
                      sock.settimeout(2)
                      sock.sendall(b"zPING\0")
                      reply = sock.recv(128).replace(b"\0", b"\n").decode("utf-8", "replace").strip()
                      if reply == "PONG":
                          print("ClamAV is ready")
                          raise SystemExit(0)
              except OSError:
                  pass
              time.sleep(2)
          raise SystemExit("ClamAV did not become ready within 180 seconds")
          PY

      - name: Verify Django backend
        working-directory: pixiu-backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production-change-me-1234567890
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
          DATABASE_URL: postgresql://pixiu:pixiu@127.0.0.1:5432/pixiu_test
          DJANGO_EXPECTED_DATABASE_NAME: pixiu_test
          DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
          DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
          DJANGO_SECURE_SSL_REDIRECT: "False"
          CLOUDFLARE_TURNSTILE_ENABLED: "False"
          CLAMAV_ENABLED: "True"
          CLAMAV_REQUIRED: "True"
          CLAMAV_INTEGRATION: "1"
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
          CLAMAV_TIMEOUT_SECONDS: "30"
          CLAMAV_CHUNK_SIZE: "1048576"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          python manage.py check
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test -v 2
          python -m compileall -q .
          python manage.py collectstatic --noinput

      - name: Verify public website build
        run: |
          npm ci
          npm run build

      - name: Verify LMS lint, safety scans, and production build
        working-directory: pixiu-lms-portal
        run: |
          npm ci
          npm run lint
          ! grep -RInE 'Zenith Public School|Vikas Pandey|\bZPS\b|\bTR-01\b|\bTR-02\b' src --exclude-dir=node_modules
          ! grep -RInE 'window\.location\.reload\s*\(' src --exclude-dir=node_modules
          ! grep -RInE 'localStorage\.(getItem|setItem|removeItem).*\b(notification|attendance|ranking|revenue|student|trainer|school)\b' src --exclude-dir=node_modules --ignore-case
          npm run build
          node ../tools/frontend_bundle_report.mjs dist/assets
