name: PIXIU Step 5-6 PostgreSQL Diagnostic
on:
  push:
    paths:
      - '.github/step56-diag-trigger'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixiu_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixiu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate and migrate
        working-directory: pixiu-lms-portal/server
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixiu_test
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
          CORS_ORIGINS: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com
        run: |
          python ../../scripts/step56_patch.py
          npm install
          node - <<'JS'
          const db=require('./database');
          const names=['users','schools','classes','students','trainers','sessions','attendance','billing','content','curriculum','inventory','leads','quizzes','quiz_questions','projects','notifications','student_reviews'];
          (async()=>{await db.ready; for(const n of names){const r=await db.get(`select count(*)::int as count from "${n}"`); console.log('PG',n,r.count)}})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Compare SQLite source counts
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('pixiu-lms-portal/server/pixiu_lms.db')
          for n in ['users','schools','classes','students','trainers','sessions','attendance','billing','content','curriculum','inventory','leads','quizzes','quiz_questions','projects','notifications','student_reviews']:
              print('SQLITE',n,db.execute(f'select count(*) from "{n}"').fetchone()[0])
          PY