name: PIXIU Step 5-6 DB v5
on:
  push:
    paths:
      - '.github/step56-v5-trigger'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixiu_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixiu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate PostgreSQL layer
        run: python scripts/step56_patch.py
      - name: Install API dependencies
        working-directory: pixiu-lms-portal/server
        run: npm install
      - name: Verify PostgreSQL migration
        working-directory: pixiu-lms-portal/server
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pixiu_test
          JWT_SECRET: test-secret-that-is-at-least-32-characters-long
          CORS_ORIGINS: https://portal.pixiutech.com,https://pixiutech.com,https://www.pixiutech.com
          DB_POOL_MAX: 5
          DB_STATEMENT_TIMEOUT_MS: 10000
        run: |
          node --check database.js
          node --check index.js
          node --check start.js
          node - <<'JS'
          const db=require('./database');
          (async()=>{await db.ready; const tables=await db.all("SELECT tablename FROM pg_tables WHERE schemaname='public'"); const s=await db.get('SELECT COUNT(*)::int AS c FROM students'); const u=await db.get('SELECT COUNT(*)::int AS c FROM users'); const schools=await db.get('SELECT COUNT(*)::int AS c FROM schools'); if(!s.c||!u.c||!schools.c) throw new Error('Core migration data missing'); console.log(`PASS tables=${tables.length} students=${s.c} users=${u.c} schools=${schools.c}`)})().catch(e=>{console.error(e);process.exit(1)})
          JS
      - name: Verify performance and production safety
        run: |
          set -euo pipefail
          ! grep -RniE "http://localhost:|http://127\.0\.0\.1:|INSERT OR REPLACE|PRAGMA |new Database\(" pixiu-lms-portal/server --include='*.js'
          grep -q "const compression = require('compression');" pixiu-lms-portal/server/index.js
          grep -q "app.use(compression());" pixiu-lms-portal/server/index.js
          grep -q "DATABASE_URL" pixiu-lms-portal/server/start.js
          grep -q "fromDatabase:" pixiu-lms-portal/render.yaml
          grep -q "DB_POOL_MAX" pixiu-lms-portal/render.yaml
      - name: Build website and LMS
        run: |
          npm install
          npm run build
          cd pixiu-lms-portal
          npm install
          npm run build
      - name: Commit production migration and clean one-shot tooling
        run: |
          rm -f .github/workflows/pixiustep56-db.yml .github/workflows/pixiustep56-db-v2.yml .github/workflows/pixiustep56-db-v3.yml .github/workflows/pixiustep56-db-v4.yml .github/workflows/pixiustep56-db-v5.yml .github/step56-trigger .github/step56-v2-trigger .github/step56-v3-trigger .github/step56-v4-trigger .github/step56-v5-trigger scripts/step56_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate LMS persistence to PostgreSQL'
          git push origin HEAD:main
