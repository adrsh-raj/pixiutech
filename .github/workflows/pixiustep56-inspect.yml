name: PIXIU Step 5-6 Legacy DB Inspection
on:
  push:
    paths:
      - '.github/step56-inspect-trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect SQLite tables
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('pixiu-lms-portal/server/pixiu_lms.db')
          tables=[r[0] for r in db.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%' order by name")]
          print('TABLES', len(tables))
          for t in tables:
              n=db.execute('select count(*) from "'+t.replace('"','""')+'"').fetchone()[0]
              print(t, n)
          db.close()
          PY